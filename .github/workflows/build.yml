name: Build Debt Machines

on:
  workflow_dispatch:
  push:
    paths:
      - 'mod-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unpack source ZIP
        run: |
          test -f mod-source.zip || { echo "ERROR: mod-source.zip is missing from repository root"; exit 1; }
          mkdir -p source
          unzip -o mod-source.zip -d source
          echo "Source archive contents:"
          find source -maxdepth 4 -type f | head -100
          test -f source/build.gradle || { echo "ERROR: build.gradle was not found at the ZIP root"; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build mod
        working-directory: source
        run: gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: debt-machines-fabric-1.21.1
          path: source/build/libs/*.jar
          if-no-files-found: error
